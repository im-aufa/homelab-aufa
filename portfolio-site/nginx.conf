server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static portfolio files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the FastAPI chat-api service.
    # The trailing slash on proxy_pass strips the /api prefix before forwarding,
    # so /api/chat → FastAPI sees /chat, /api/login → FastAPI sees /login, etc.
    location /api/ {
        proxy_pass http://chat-api:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support long-running requests (docling processing can be slow)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
