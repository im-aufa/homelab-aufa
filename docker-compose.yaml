services:
  chat-api:
    build: ./chat-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chat-api-data:/app/data
      - /mnt/data/projects/cerina/documents:/app/documents:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - OLLAMA_MAX_LOADED_MODELS=2
      - CHAT_MODEL=${CHAT_MODEL:-qwen3.5:4b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - LOCAL_SECRET_KEY=${LOCAL_SECRET_KEY}
      - LOCAL_USERNAME=${LOCAL_USERNAME}
      - LOCAL_PASSWORD=${LOCAL_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - homelab

  portfolio-site:
    build: ./portfolio-site
    container_name: portfolio-site
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:8081:80"
    networks: [homelab]

volumes:
  chat-api-data:

networks:
  homelab:
    external: true
